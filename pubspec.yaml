name: kaminari
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  webview_flutter: ^4.13.1
  freezed_annotation: ^3.1.0
  google_generative_ai: ^0.4.5
  flutter_dotenv: ^6.0.1
  json_annotation: ^4.12.0
  sqflite: ^2.4.2+1
  connectivity_plus: ^7.3.0
  path: ^1.9.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  tiny_segmenter_dart: ^1.0.1
  jp_transliterate: ^1.0.5
  epub_pro: ^5.6.0
  html: ^0.15.6
  file_picker: ^11.0.2
  image: ^4.8.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:

  uses-material-design: true

  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-VariableFont_wght.ttf

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
    
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP-VariableFont_wght.ttf
        
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-VariableFont_wght.ttf

  assets:
    - .env
    - assets/images/placeholder_book.png
    - assets/data/